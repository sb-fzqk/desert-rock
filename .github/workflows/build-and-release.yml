name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
      name: Build on ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      permissions:
        contents: write

      strategy:
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Linux Dependencies
          if: runner.os == 'Linux'
          run: |
            sudo apt-get update
            sudo apt-get install -y libportaudio2 python3-tk

        - name: Install Python Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller

        - name: Build Executable with PyInstaller
          run: pyinstaller desert_rock.spec

        - name: Archive Binary (Linux)
          if: runner.os == 'Linux'
          run: |
            cd dist
            tar -czvf ../DesertRock-Linux.tar.gz DesertRock

        - name: Archive Binary (macOS)
          if: runner.os == 'macOS'
          run: |
            cd dist
            zip -r ../DesertRock-macOS.zip DesertRock.app

        - name: Archive Binary (Windows)
          if: runner.os == 'Windows'
          shell: pwsh
          run: Compress-Archive -Path dist/DesertRock/* -DestinationPath DesertRock-Windows.zip 

        - name: Upload to GitHub Release
          uses: softprops/action-gh-release@v2
          with: 
            files: DesertRock-*
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       